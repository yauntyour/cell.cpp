name: Build & Release

on:
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ autoconf automake libtool pkg-config libssl-dev

      - name: Configure & Build
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc
          cmake --build build --config Release

      - name: Verify static linking
        run: |
          ldd build/cell || true
          file build/cell

      - name: Package
        run: tar -czf cell-linux-x64.tar.gz -C build cell LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cell-linux-x64
          path: cell-linux-x64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja -y

      - name: Configure & Build
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Verify static linking
        run: |
          dumpbin /dependents build\cell.exe

      - name: Package
        run: Compress-Archive -Path build\cell.exe,LICENSE -DestinationPath cell-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cell-windows-x64
          path: cell-windows-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC & build tools
        run: |
          brew update
          brew install gcc cmake ninja openssl autoconf automake libtool

      - name: Detect GCC version
        id: gcc
        run: |
          GCC_VER=$(ls /opt/homebrew/bin/g++-* 2>/dev/null | sed 's|.*/g++-||' | sort -V | tail -1)
          echo "version=${GCC_VER}" >> "$GITHUB_OUTPUT"
          echo "Using g++-${GCC_VER}"

      - name: Configure & Build
        env:
          CC: /opt/homebrew/bin/gcc-${{ steps.gcc.outputs.version }}
          CXX: /opt/homebrew/bin/g++-${{ steps.gcc.outputs.version }}
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=${{ env.CXX }} \
            -DCMAKE_C_COMPILER=${{ env.CC }}
          cmake --build build --config Release

      - name: Verify static linking
        run: |
          otool -L build/cell || true
          file build/cell

      - name: Package
        run: tar -czf cell-macos-arm64.tar.gz -C build cell LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cell-macos-arm64
          path: cell-macos-arm64.tar.gz

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: |
            artifacts/cell-linux-x64/cell-linux-x64.tar.gz
            artifacts/cell-windows-x64/cell-windows-x64.zip
            artifacts/cell-macos-arm64/cell-macos-arm64.tar.gz
          generate_release_notes: true
