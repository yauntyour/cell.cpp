name: Build & Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  BUILD_TYPE: Release

jobs:
  build-linux-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ curl libssl-dev

      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_INSTALLATION_ROOT"
          "$VCPKG_INSTALLATION_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install curl[core,ssl]:x64-linux libsodium:x64-linux

      - name: Generate CMakeLists.txt
        run: |
          cat > CMakeLists.txt << 'CMAKE_EOF'
          cmake_minimum_required(VERSION 3.21)
          project(cell LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 26)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          include(FetchContent)
          FetchContent_Declare(json
            GIT_REPOSITORY https://github.com/nlohmann/json.git
            GIT_TAG v3.12.0
            GIT_SHALLOW TRUE
          )
          FetchContent_MakeAvailable(json)
          find_package(CURL REQUIRED)
          find_package(unofficial-sodium REQUIRED)
          add_executable(cell cell.cpp)
          target_link_libraries(cell PRIVATE nlohmann_json::nlohmann_json CURL::libcurl unofficial-sodium::sodium)
          CMAKE_EOF

      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_CXX_FLAGS="-static-libgcc -static-libstdc++"
          -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++ -lpthread -ldl"
          -DVCPKG_TARGET_TRIPLET=x64-linux
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_INSTALLATION_ROOT }}/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Package
        run: |
          tar -czf cell-linux-x64.tar.gz -C build cell LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cell-linux-x64
          path: cell-linux-x64.tar.gz

  build-linux-clang:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang curl libssl-dev

      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_INSTALLATION_ROOT"
          "$VCPKG_INSTALLATION_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install curl[core,ssl]:x64-linux libsodium:x64-linux

      - name: Generate CMakeLists.txt
        run: |
          cat > CMakeLists.txt << 'CMAKE_EOF'
          cmake_minimum_required(VERSION 3.21)
          project(cell LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 26)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          include(FetchContent)
          FetchContent_Declare(json
            GIT_REPOSITORY https://github.com/nlohmann/json.git
            GIT_TAG v3.12.0
            GIT_SHALLOW TRUE
          )
          FetchContent_MakeAvailable(json)
          find_package(CURL REQUIRED)
          find_package(unofficial-sodium REQUIRED)
          add_executable(cell cell.cpp)
          target_link_libraries(cell PRIVATE nlohmann_json::nlohmann_json CURL::libcurl unofficial-sodium::sodium)
          CMAKE_EOF

      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_FLAGS="-static-libgcc -static-libstdc++"
          -DCMAKE_EXE_LINKER_FLAGS="-static-libgcc -static-libstdc++ -lpthread -ldl"
          -DVCPKG_TARGET_TRIPLET=x64-linux
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_INSTALLATION_ROOT }}/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Package
        run: |
          tar -czf cell-linux-x64-clang.tar.gz -C build cell LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cell-linux-x64-clang
          path: cell-linux-x64-clang.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$env:VCPKG_INSTALLATION_ROOT"
          & "$env:VCPKG_INSTALLATION_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg" install curl[core,ssl]:x64-windows-static libsodium:x64-windows-static

      - name: Generate CMakeLists.txt
        shell: bash
        run: |
          cat > CMakeLists.txt << 'CMAKE_EOF'
          cmake_minimum_required(VERSION 3.21)
          project(cell LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 26)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          include(FetchContent)
          FetchContent_Declare(json
            GIT_REPOSITORY https://github.com/nlohmann/json.git
            GIT_TAG v3.12.0
            GIT_SHALLOW TRUE
          )
          FetchContent_MakeAvailable(json)
          find_package(CURL REQUIRED)
          find_package(unofficial-sodium REQUIRED)
          add_executable(cell cell.cpp)
          target_link_libraries(cell PRIVATE nlohmann_json::nlohmann_json CURL::libcurl unofficial-sodium::sodium)
          CMAKE_EOF

      - name: Configure CMake
        run: |
          cmake -B build -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Package
        run: Compress-Archive -Path build\Release\cell.exe,LICENSE -DestinationPath cell-windows-x64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cell-windows-x64
          path: cell-windows-x64.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake ninja curl openssl libsodium

      - name: Setup vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$VCPKG_INSTALLATION_ROOT"
          "$VCPKG_INSTALLATION_ROOT/bootstrap-vcpkg.sh" -disableMetrics
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install curl[core,ssl]:arm64-osx libsodium:arm64-osx

      - name: Generate CMakeLists.txt
        run: |
          cat > CMakeLists.txt << 'CMAKE_EOF'
          cmake_minimum_required(VERSION 3.21)
          project(cell LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 26)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)
          include(FetchContent)
          FetchContent_Declare(json
            GIT_REPOSITORY https://github.com/nlohmann/json.git
            GIT_TAG v3.12.0
            GIT_SHALLOW TRUE
          )
          FetchContent_MakeAvailable(json)
          find_package(CURL REQUIRED)
          find_package(unofficial-sodium REQUIRED)
          add_executable(cell cell.cpp)
          target_link_libraries(cell PRIVATE nlohmann_json::nlohmann_json CURL::libcurl unofficial-sodium::sodium "-framework Security" "-framework CoreFoundation")
          CMAKE_EOF

      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DVCPKG_TARGET_TRIPLET=arm64-osx
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_INSTALLATION_ROOT }}/scripts/buildsystems/vcpkg.cmake

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }}

      - name: Package
        run: tar -czf cell-macos-arm64.tar.gz -C build cell LICENSE

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cell-macos-arm64
          path: cell-macos-arm64.tar.gz

  release:
    needs: [build-linux-gcc, build-linux-clang, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            artifacts/cell-linux-x64/cell-linux-x64.tar.gz
            artifacts/cell-linux-x64-clang/cell-linux-x64-clang.tar.gz
            artifacts/cell-windows-x64/cell-windows-x64.zip
            artifacts/cell-macos-arm64/cell-macos-arm64.tar.gz
          generate_release_notes: true
